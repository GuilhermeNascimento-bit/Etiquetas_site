<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Etiquetas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">🏷️</span>
    <div>
      <h1>Gerador de Etiquetas</h1>
      <p>Etiqueta de identificação do alimento em branco, pronta pra preencher à mão</p>
    </div>
  </div>
</header>

<main class="layout">

  <!-- Coluna 1: Personalização -->
  <section class="painel" id="painel-config">
    <h2>Personalização</h2>

    <div class="grupo">
      <label class="campo">
        <span>Logo (opcional, substitui o nome)</span>
        <input type="file" id="logo-input" accept="image/*">
      </label>
      <div id="logo-preview-wrap" class="logo-preview-wrap" hidden>
        <img id="logo-preview" alt="Logo">
        <button type="button" id="logo-remove" class="btn-link">remover</button>
      </div>

      <label class="campo">
        <span>Nome da empresa</span>
        <input type="text" id="nome-loja" maxlength="40">
      </label>
    </div>

    <div class="grupo">
      <h3>Tamanho da etiqueta</h3>
      <div class="campo-grid2">
        <label class="campo">
          <span>Largura (mm)</span>
          <input type="number" id="largura-mm" min="20" max="300" step="1">
        </label>
        <label class="campo">
          <span>Altura (mm)</span>
          <input type="number" id="altura-mm" min="10" max="300" step="1">
        </label>
      </div>
    </div>

    <div class="grupo">
      <h3>Cores</h3>
      <div class="campo-grid3">
        <label class="campo">
          <span>Faixa</span>
          <input type="color" id="cor-faixa">
        </label>
        <label class="campo">
          <span>Texto da faixa</span>
          <input type="color" id="cor-texto-faixa">
        </label>
        <label class="campo">
          <span>Validade</span>
          <input type="color" id="cor-destaque">
        </label>
      </div>
    </div>

    <button type="button" id="restaurar-padrao" class="btn-secundario">Restaurar padrão</button>
  </section>

  <!-- Coluna 2: Preview e ações -->
  <section class="painel" id="painel-preview">
    <h2>Pré-visualização</h2>
    <div class="preview-wrap">
      <canvas id="preview-canvas"></canvas>
    </div>

    <div class="gerar-row">
      <label class="campo">
        <span>Quantidade de etiquetas</span>
        <input type="number" id="qtde" min="1" max="1000" step="1" value="1">
      </label>
      <button type="button" id="gerar-pdf" class="btn-primario">Gerar PDF</button>
    </div>
    <p id="gerar-status" class="status-msg"></p>

    <h2 class="historico-title">Histórico</h2>
    <div id="historico-lista" class="historico-lista"></div>
  </section>

</main>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
